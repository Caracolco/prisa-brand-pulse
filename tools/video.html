<!doctype html><html><head><meta charset="utf-8"><style>
:root{--blue:#0096DC;--pink:#FD006E;--yellow:#FFCB00;--green:#2fd27a}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:720px;overflow:hidden;background:#0a0c10;font-family:Inter,sans-serif;color:#f4f6f8}
.sc{position:absolute;inset:0;opacity:0}.a{position:absolute}
.glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:.3}
.h{font-weight:900;letter-spacing:-.04em;line-height:1}
.g{background:linear-gradient(100deg,#0096DC,#FD006E 55%,#FFCB00);-webkit-background-clip:text;color:transparent}
.tag{font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow)}
.card{background:#141920;border:1px solid #ffffff18;border-radius:26px}
.dot{position:absolute;width:26px;height:26px;border-radius:50%}
.pill{position:absolute;padding:14px 26px;border-radius:99px;font-weight:800;font-size:26px;background:#ffffff10;border:1px solid #ffffff22}
</style></head><body>
<div class="glow" style="width:640px;height:640px;background:#0096DC;left:-200px;top:-240px"></div>
<div class="glow" style="width:600px;height:600px;background:#FD006E;right:-200px;bottom:-260px"></div>
<div id="root"></div>
<script>
const R=document.getElementById('root');
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),pr=(t,a,d)=>cl((t-a)/d),eo=x=>1-Math.pow(1-x,3),eb=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const S=[[0,7.6],[7.6,17.3],[17.3,28],[28,38.8],[38.8,46.7],[46.7,60]];
function mk(h){const d=document.createElement('div');d.className='sc';d.innerHTML=h;R.appendChild(d);return d}
const $$=(d,s)=>[...d.querySelectorAll(s)];
// ---- escena 1
const s1=mk(`<div class="a tag" style="left:80px;top:70px">PRISA Brand Pulse</div>
<div class="a h" id="t1" style="left:80px;top:150px;font-size:92px;width:600px">¿Cuántos recuerdan <span class="g">la marca</span>?</div>
<div class="a h" id="t1b" style="left:80px;top:500px;font-size:40px;color:#aeb8c3;font-weight:700">Casi siempre se mide tarde.<br>O no se mide.</div>
<div id="grid"></div><div class="a" style="right:90px;top:560px;font-size:64px;font-weight:900;letter-spacing:-.04em" id="pc1">0%</div>`);
const grid=s1.querySelector('#grid');for(let i=0;i<100;i++){const d=document.createElement('div');d.className='dot';d.style.left=(740+(i%10)*46)+'px';d.style.top=(80+Math.floor(i/10)*46)+'px';d.style.background='#ffffff14';grid.appendChild(d)}
const gd=[...grid.children];const order=[...Array(100).keys()].sort((a,b)=>Math.sin(a*91.7)-Math.sin(b*91.7));
// ---- escena 2
const ints=[['Voto en una historia','#FD006E',''],['Respuesta por WhatsApp','#2fd27a',''],['Comentario en un live','#FFCB00',''],['Pregunta en el player','#0096DC','']];
const s2=mk(`<div class="a tag" style="left:80px;top:70px">Qué es</div><div class="a h" style="left:80px;top:120px;font-size:84px">Lo que la audiencia<br><span class="g">ya hace.</span></div>
${ints.map((x,i)=>`<div class="a card ic" style="left:${80+(i%2)*540}px;top:${380+Math.floor(i/2)*150}px;width:500px;height:120px;border-color:${x[1]}88"><div class="a" style="left:28px;top:36px;width:48px;height:48px;border-radius:50%;background:${x[1]}"></div><div class="a h" style="left:100px;top:40px;font-size:29px;letter-spacing:-.02em">${x[0]}</div></div>`).join('')}`);
// ---- escena 3
const nodes=[['Antes','Pregunta base','#0096DC'],['Campaña','Colcafé en LOS40','#FD006E'],['Después','Misma pregunta','#FFCB00'],['Día 7','Opcional','#2fd27a']];
const s3=mk(`<div class="a tag" style="left:80px;top:70px">Método</div><div class="a h" style="left:80px;top:120px;font-size:84px">Medir. Activar.<br><span class="g">Volver a medir.</span></div>
<div class="a" style="left:120px;top:520px;width:1040px;height:6px;background:#ffffff18;border-radius:3px"></div><div class="a" id="ln3" style="left:120px;top:520px;width:0;height:6px;background:linear-gradient(90deg,#0096DC,#FD006E,#FFCB00,#2fd27a);border-radius:3px"></div>
${nodes.map((n,i)=>`<div class="a nd" style="left:${120+i*346-30}px;top:490px;width:260px"><div style="width:68px;height:68px;border-radius:50%;background:${n[2]};margin-left:0"></div><div class="h" style="font-size:36px;margin-top:16px">${n[0]}</div><div style="font-size:22px;color:#aeb8c3;margin-top:4px;font-weight:600">${n[1]}</div></div>`).join('')}
<div class="a card" id="q3" style="right:80px;top:150px;width:420px;padding:26px"><div style="font-size:15px;font-weight:800;color:#6f7b88;letter-spacing:.15em">LA MISMA PREGUNTA</div><div class="h" style="font-size:34px;margin-top:10px;letter-spacing:-.02em">¿Qué marca de café recuerdas?</div></div>`);
// ---- escena 4
const pls=[['Instagram','#FD006E'],['Radio','#FFCB00'],['TikTok Live','#2fd27a'],['YouTube Live','#ff5a3c'],['Streaming','#0096DC'],['Display','#a56bff']];
const s4=mk(`<div class="a tag" style="left:80px;top:70px">Ejemplo</div><div class="a h" style="left:80px;top:120px;font-size:96px">LOS40 <span style="color:#6f7b88">+</span> <span class="g">Colcafé</span></div>
${pls.map((p,i)=>`<div class="pill pp" style="left:${80+(i%3)*380}px;top:${330+Math.floor(i/3)*100}px;border-color:${p[1]}99;color:${p[1]}">${p[0]}</div>`).join('')}
<div class="a card" id="esp" style="left:80px;top:550px;width:560px;height:110px;padding:22px 30px"><div style="font-size:15px;font-weight:800;color:#FD006E;letter-spacing:.15em">ESPONTÁNEA</div><div class="h" style="font-size:30px;margin-top:8px;letter-spacing:-.02em">Sin opciones</div></div>
<div class="a card" id="asi" style="left:660px;top:550px;width:540px;height:110px;padding:22px 30px"><div style="font-size:15px;font-weight:800;color:#0096DC;letter-spacing:.15em">ASISTIDA</div><div class="h" style="font-size:30px;margin-top:8px;letter-spacing:-.02em">Con opciones</div></div>`);
// ---- escena 5
const bars=[['Antes',38,'#0096DC'],['Después',52,'#FFCB00'],['Día 7',45,'#2fd27a']];
const s5=mk(`<div class="a tag" style="left:80px;top:70px">Resultados</div><div class="a h" style="left:80px;top:120px;font-size:84px">El <span class="g">tablero.</span></div>
<div class="a" style="left:80px;top:300px;width:700px;height:330px;border-bottom:2px solid #ffffff22"></div>
${bars.map((b,i)=>`<div class="a br" style="left:${130+i*220}px;bottom:90px;width:150px;height:0;background:${b[2]};border-radius:16px 16px 0 0"><div class="a h" style="top:-54px;left:0;right:0;text-align:center;font-size:44px">${b[1]}%</div></div><div class="a" style="left:${130+i*220}px;top:644px;width:150px;text-align:center;font-size:22px;color:#aeb8c3;font-weight:700">${b[0]}</div>`).join('')}
<div class="a card" id="k5" style="left:850px;top:300px;width:350px;padding:28px"><div class="h" style="font-size:64px;color:#FFCB00" id="d5">+14 pp</div><div style="font-size:22px;color:#aeb8c3;margin-top:8px">observado, asistida</div></div>
<div class="a card" id="k5b" style="left:850px;top:460px;width:350px;padding:28px"><div class="h" style="font-size:44px">n = 1.620</div><div style="font-size:22px;color:#aeb8c3;margin-top:8px">margen ± 2,4 pp</div></div>`);
// ---- escena 6
const s6=mk(`<div class="a tag" id="tg6" style="left:80px;top:70px">Ojo</div>
<div class="a h" id="h6" style="left:80px;top:120px;font-size:88px;width:1000px"><span style="color:#FFCB00">Cambio</span> no es <span class="g">causa.</span></div>
<div class="a card" id="c6" style="left:80px;top:380px;width:520px;height:230px;padding:30px"><div style="font-size:18px;font-weight:800;color:#6f7b88;letter-spacing:.15em">SIN CONTROL</div><div class="h" style="font-size:96px;margin-top:20px;color:#FFCB00">+14 pp</div></div>
<div class="a card" id="c6b" style="left:660px;top:380px;width:540px;height:230px;padding:30px;border-color:#2fd27a88"><div style="font-size:18px;font-weight:800;color:#2fd27a;letter-spacing:.15em">CON GRUPO DE CONTROL</div><div class="h" style="font-size:70px;margin-top:34px">+14 <span style="color:#6f7b88">−3</span> = <span style="color:#2fd27a">+11</span></div></div>
<div class="a" id="fin" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0c10"><div class="h" style="font-size:130px">Brand <span class="g">Pulse</span></div><div style="font-size:26px;color:#aeb8c3;margin-top:20px;font-weight:600">PRISA Media · Antes. Campaña. Después. Día 7.</div><svg width="700" height="80" viewBox="0 0 700 80" style="margin-top:30px"><path id="pl" d="M0 40H220L240 40 270 8 310 72 345 24 365 40H700" fill="none" stroke="#FD006E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="900" stroke-dashoffset="900"/></svg></div>`);
const sc=[s1,s2,s3,s4,s5,s6];
function seek(t){
  sc.forEach((s,i)=>{const [a,b]=S[i];const v=cl((t-a)/.5)*(i==5?1:cl((b-t)/.5));s.style.opacity=t>=a&&t<b?(i==0?cl((b-t)/.5):v):0;});
  // 1
  let l=t-0;const on=Math.round(eo(pr(l,1.2,3.2))*38);gd.forEach((d,k)=>{const lit=order.indexOf(k)<on;d.style.background=lit?'#0096DC':'#ffffff14';d.style.transform=lit?'scale(1.08)':''});
  $('#pc1').textContent=on+'%';$('#t1').style.opacity=eo(pr(l,.3,.8));$('#t1').style.transform=`translateY(${(1-eo(pr(l,.3,.8)))*30}px)`;
  $('#t1b').style.opacity=eo(pr(l,4,.7));$('#t1b').style.transform=`translateY(${(1-eo(pr(l,4,.7)))*20}px)`;
  // 2
  $$(s2,'.ic').forEach((c,i)=>{const p=eb(pr(t-7.6,1.2+i*1.7,.7));c.style.opacity=pr(t-7.6,1.2+i*1.7,.3);c.style.transform=`translateY(${(1-p)*50}px) scale(${.9+.1*p})`});
  // 3
  const l3=t-17.3;$('#ln3').style.width=eo(pr(l3,1.2,8.5))*1040+'px';
  $$(s3,'.nd').forEach((n,i)=>{const p=eb(pr(l3,1.2+i*2.5,.6));n.style.opacity=pr(l3,1.2+i*2.5,.3);n.style.transform=`translateY(${(1-p)*30}px)`});
  $('#q3').style.opacity=eo(pr(l3,.8,.6));
  // 4
  const l4=t-28;$$(s4,'.pp').forEach((n,i)=>{const p=eb(pr(l4,1.4+i*.55,.5));n.style.opacity=pr(l4,1.4+i*.55,.2);n.style.transform=`scale(${.7+.3*p})`});
  $('#esp').style.opacity=eo(pr(l4,6.5,.5));$('#asi').style.opacity=eo(pr(l4,7.8,.5));
  // 5
  const l5=t-38.8;$$(s5,'.br').forEach((b,i)=>{b.style.height=eo(pr(l5,.8+i*.7,1))*bars[i][1]*5+'px'});
  $('#k5').style.opacity=eo(pr(l5,3.4,.5));$('#k5b').style.opacity=eo(pr(l5,4.4,.5));
  // 6
  const l6=t-46.7;$('#h6').innerHTML=l6<4.2?'<span style="color:#FFCB00">Cambio</span> no es <span class="g">causa.</span>':'Falta un <span class="g">control.</span>';
  $('#c6').style.opacity=eo(pr(l6,1,.5));$('#c6b').style.opacity=eo(pr(l6,4.5,.5));$('#c6').style.filter=l6>4.5?'saturate(.4)':'';
  const f=pr(l6,9.2,.8);$('#fin').style.opacity=f;$('#fin').style.display=f>0?'flex':'none';$('#pl').style.strokeDashoffset=900*(1-eo(pr(l6,9.5,2)));
}
function $(s){return document.querySelector(s)}
seek(0);window.seek=seek;
</script></body></html>
